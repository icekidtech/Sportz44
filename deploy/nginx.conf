# Nginx reverse proxy for the Sportz44 API server.
#
# Place this in /etc/nginx/sites-available/sportz44 and symlink it into
# sites-enabled. Replace api.sportz44.app with your domain.
#
#   sudo ln -s /etc/nginx/sites-available/sportz44 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For TLS, obtain a cert with certbot:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.sportz44.app

# HTTP → HTTPS redirect (uncomment the server block below once TLS is set up)
# server {
#     listen 80;
#     server_name api.sportz44.app;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name api.sportz44.app;

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # ---- Health check ----
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- WebSocket (live match updates) ----
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived WS connections
        proxy_send_timeout 3600s;
    }

    # ---- Static / misc ----
    location / {
        return 404;
    }
}
